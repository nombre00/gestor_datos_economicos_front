@if (datos(); as d) {
  <app-barras-apiladas
    [categorias]="d.categorias"
    [series]="d.series"
    [apilar]="false"
    titulo="Monto vigente que vence por año"
    etiquetaY="Millones (moneda de origen)" />
} @else if (datos() === null) {
  <p class="estado">No se pudieron cargar los vencimientos.</p>
} @else {
  <p class="estado">Cargando…</p>
}
