<h2>Composición por moneda</h2>

@if (datos(); as d) {
  <app-area-apilada
    [categorias]="d.categorias"
    [series]="d.series"
    titulo="Deuda bruta por moneda"
    etiquetaY="Millones de USD"
  />

  <app-tabla-datos
    [categorias]="d.categorias"
    [series]="d.series"
    titulo="Deuda por moneda"
    unidad="millones de USD"
    [mostrarTotal]="true"
    nombreArchivo="composicion_moneda" 
  />
} @else if (datos() === null) {
  <p>No se pudo cargar el gráfico. ¿Está corriendo el backend?</p>
} @else {
  <p>Cargando…</p>
}
