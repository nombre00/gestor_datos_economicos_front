<h2>Tenedores de Bonos de Gobierno</h2>

@if (datos(); as d) {
  <app-area-apilada
    [categorias]="d.categorias"
    [series]="d.series"
    titulo="Quién tiene los bonos de Gobierno (monto)"
    etiquetaY="Miles de millones de CLP"
  />
  <app-area-apilada
    [categorias]="d.categorias"
    [series]="d.series"
    modo="porcentaje"
    titulo="Participación de cada tenedor"
    etiquetaY="% del total"
  />

  <app-tabla-datos
    [categorias]="d.categorias"
    [series]="d.series"
    titulo="Tenedores de Bonos de Gobierno por trimestre"
    etiquetaCategoria="Trimestre"
    unidad="miles de millones de CLP"
    [mostrarTotal]="true"
    nombreArchivo="tenedores_gobierno" 
  />
} @else if (datos() === null) {
  <p>No se pudo cargar el gráfico. ¿Está corriendo el backend?</p>
} @else {
  <p>Cargando…</p>
}
